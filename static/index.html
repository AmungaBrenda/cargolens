<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CargoLens</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>html, body, #map { height: 100%; margin: 0; }</style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([50.5, 1.0], 7);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    fetch("/vessels")
      .then(r => r.json())
      .then(vessels => {
                vessels.forEach(v => {
          const flagged = v.alert !== null;
          L.circleMarker([v.lat, v.lon], {
            radius: flagged ? 9 : 5,
            color: flagged ? "#c0392b" : "#2471a3",
            fillColor: flagged ? "#e74c3c" : "#3498db",
            fillOpacity: 0.8
          })
            .addTo(map)
            .bindPopup(
              `<b>${v.name}</b><br>MMSI ${v.mmsi}<br>${v.speed ?? "?"} knots` +
              (flagged ? `<br><b style="color:#c0392b">⚠ ${v.alert}</b>` : "")
            );
        });
      });
  </script>
</body>
</html>
