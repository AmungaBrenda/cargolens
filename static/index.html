<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CargoLens | Live vessel tracking</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">&#9672;</span> CargoLens <small>live vessel tracking</small></div>
    <div class="live"><span class="dot" id="dot"></span><span id="updated">Connecting…</span></div>
  </header>

  <main class="layout">
    <aside class="panel">
      <section class="stats">
        <div class="stat"><span class="num" id="stat-total">0</span><span class="lbl">Ships tracked</span></div>
        <div class="stat warn"><span class="num" id="stat-alerts">0</span><span class="lbl">Active alerts</span></div>
        <div class="stat bad"><span class="num" id="stat-stopped">0</span><span class="lbl">Stopped offshore</span></div>
        <div class="stat amber"><span class="num" id="stat-fast">0</span><span class="lbl">High speed</span></div>
      </section>

      <section class="controls">
        <input id="search" type="search" placeholder="Search ship name or MMSI" autocomplete="off">
        <div class="chips" id="chips">
          <button class="chip active" data-filter="all">All ships</button>
          <button class="chip" data-filter="STOPPED_OFFSHORE">Stopped offshore</button>
          <button class="chip" data-filter="HIGH_SPEED">High speed</button>
        </div>
      </section>

      <ul id="list" class="list"></ul>
    </aside>

    <div id="map" aria-label="Map of tracked vessels"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
